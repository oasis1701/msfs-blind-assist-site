# Site settings. Every value here is available in pages and layouts as site.<name>.
title: MSFS Blind Assist
description: >-
  A free, screen reader accessible Windows application that lets blind and
  visually impaired pilots control and fly aircraft in Microsoft Flight Simulator
  with a keyboard.
lang: en
author: Hadi Rezaei

# Where the site is served. The custom domain serves the site at its root, so baseurl is
# empty. At the default GitHub Pages address the repository name is part of the URL and
# baseurl would have to match it: /msfs-blind-assist-site.
url: https://msfsblindassist.com
baseurl: ""

# Links used across the site.
app_repo: https://github.com/oasis1701/msfs-blind-assist
discord: https://discord.gg/7udKUYFFY7

permalink: pretty
markdown: kramdown
timezone: UTC

# Both plugins are on the GitHub Pages allow-list, so the built-in builder runs them.
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Every page uses the default layout unless it says otherwise.
defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - README.md
  - CLAUDE.md
  - CLAUDE.local.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - assets/css/SIMPLE-CSS-LICENSE.txt
